[package]
name = "adafruit-ultimate-gps"
version = "0.1.0"
edition = "2024"
authors = ["Jonathan D. Baker <jonathan@ardent.tech>"]
description = "A no-std driver for the Adafruit Ultimate GPS breakout board."
keywords = ["embedded", "gps", "mt3339"]
categories = ["embedded", "no-std"]
repository = "https://github.com/ardentTech/adafruit-ultimate-gps"
license = "MIT OR Apache-2.0"
exclude = ["CHANGELOG.md", "examples/*"]
readme = "README.md"

[dependencies]
chrono = { version = "0.4.45", default-features = false }
defmt = { version = "1.1.1", optional = true }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
heapless = { version = "0.9.3", features = ["defmt"] }
nmea = { version = "0.8.0", default-features = false, features = ["defmt", "GLL", "RMC", "VTG", "GGA", "GSA", "GSV", "ZDA"] }
pmtk = { version = "0.4.0", features = ["defmt", "mt3339"] }

[features]
default = []
defmt = ["dep:defmt"]